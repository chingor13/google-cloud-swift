[workspace]
resolver        = "3"
default-members = ["packages/auth/rust_auth_core"]
members         = ["packages/auth/rust_auth_core"]

[workspace.package]
edition      = "2024"
authors      = ["Google LLC"]
description  = "Google Cloud Client Libraries for Swift"
license      = "Apache-2.0"
repository   = "https://github.com/googleapis/google-cloud-swift/tree/main"
keywords     = ["gcp", "google-cloud", "google-cloud-swift", "sdk"]
categories   = ["network-programming"]
rust-version = "1.94.0"


[workspace.dependencies]
# We need to pin this dependency to make the `.swift` output file reproducible.
uniffi            = { default-features = false, version = "=0.31.0" }
thiserror         = { default-features = false, version = "1.0" }
google-cloud-auth = { default-features = false, version = "1.7" }
http              = { default-features = false, version = "1.4" }
tokio             = { default-features = false, version = "1.50" }
