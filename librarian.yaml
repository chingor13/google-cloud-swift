default:
  output: generated/
  swift:
    dependencies:
      - name: GoogleApi
        path: generated/google-api
        api_package: google.api
      - name: GoogleCloudAuth
        path: packages/auth
        required_by_services: true
      - name: GoogleCloudCommon
        path: generated/google-cloud-common
        api_package: google.cloud.common
      - name: GoogleCloudGax
        path: packages/gax
        required_by_services: true
      - name: GoogleCloudLocation
        path: generated/google-cloud-location
        api_package: google.cloud.location
      - name: GoogleCloudWkt
        path: packages/wkt
        api_package: google.protobuf
      - name: GoogleIamV1
        path: generated/google-iam-v1
        api_package: google.iam.v1
      - name: GoogleLongrunning
        path: generated/google-longrunning
        api_package: google.longrunning
      - name: GoogleRpc
        path: generated/google-rpc
        api_package: google.rpc
      - name: GoogleType
        path: generated/google-type
        api_package: google.type
      - name: Logging
        url: https://github.com/apple/swift-log
        version: 1.12.0
        required_by_services: true
libraries:
  - name: GoogleApi
    apis:
