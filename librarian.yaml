default:
  output: generated/
  swift:
    dependencies:
      - name: GoogleApi
        path: generated/google-api
        api_package: google.api
      - name: GoogleCloudAuth
        path: packages/auth
        required_by_services: true
      - name: GoogleCloudGax
        path: packages/gax
        required_by_services: true
      - name: GoogleCloudLocation
        path: generated/google-cloud-location
        api_package: google.cloud.location
      - name: GoogleCloudWkt
        path: packages/wkt
        api_package: google.protobuf
      - name: GoogleIamV1
        path: generated/google-iam-v1
        api_package: google.iam.v1
      - name: GoogleLongrunning
        path: generated/google-longrunning
        api_package: google.longrunning
      - name: GoogleRpc
        path: generated/google-rpc
        api_package: google.rpc
      - name: GoogleType
        path: generated/google-type
        api_package: google.type
      - name: Logging
        url: https://github.com/apple/swift-log
        version: 1.12.0
        required_by_services: true
libraries:
  - name: GoogleApi
    apis:
      - path: google/api
    copyright_year: "2026"
  - name: GoogleCloudEdgecontainerV1
    apis:
      - path: google/cloud/edgecontainer/v1
    copyright_year: "2026"
  - name: GoogleCloudLocation
    apis:
      - path: google/cloud/location
    copyright_year: "2026"
  - name: GoogleCloudResourcemanagerV3
    apis:
      - path: google/cloud/resourcemanager/v3
    copyright_year: "2026"
  - name: GoogleCloudRunV2
    apis:
      - path: google/cloud/run/v2
    copyright_year: "2026"
  - name: GoogleCloudSecretmanagerV1
    apis:
      - path: google/cloud/secretmanager/v1
    copyright_year: "2026"
  - name: GoogleCloudSecurityPubliccaV1
    apis:
      - path: google/cloud/security/publicca/v1
    copyright_year: "2026"
  - name: GoogleCloudSqlV1
    apis:
      - path: google/cloud/sql/v1
    copyright_year: "2026"
    swift:
      per_service_traits: true
  - name: GoogleCloudTpuV2
    apis:
      - path: google/cloud/tpu/v2
    copyright_year: "2026"
  - name: GoogleCloudWkt
    copyright_year: "2026"
    output: packages/wkt/Sources/GoogleCloudWkt/generated
    roots:
      - protobuf-src
    swift:
      include_list:
        - api.proto
        - type.proto
        - source_context.proto
      modules:
        - output: packages/wkt/Sources/GoogleCloudWkt/generated
          api_path: google/protobuf
  - name: GoogleCloudWorkflowsV1
    apis:
      - path: google/cloud/workflows/v1
    copyright_year: "2026"
  - name: GoogleContainerV1
    apis:
      - path: google/container/v1
    copyright_year: "2026"
  - name: GoogleIamV1
    apis:
      - path: google/iam/v1
    copyright_year: "2026"
  - name: GoogleLongrunning
    apis:
      - path: google/longrunning
    copyright_year: "2026"
  - name: GoogleRpc
    apis:
      - path: google/rpc
    copyright_year: "2026"
  - name: GoogleType
    apis:
      - path: google/type
    copyright_year: "2026"
  - name: TestsProtoJSON
    copyright_year: "2026"
    output: Tests/ProtoJSON/generated
    roots:
      - Tests/ProtoJSON/protos
    skip_release: true
    swift:
      modules:
        - output: Tests/ProtoJSON/generated
          api_path: Tests/ProtoJSON/protos
