name: Regenerate

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  format:
    name: Regenerate GAPIC Libraries
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - name: Install Swift Dependencies
        run: |
          set -e
          sudo apt update -y
          sudo apt install -y libncurses6

      - name: Set up Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # ratchet:swift-actions/setup-swift@v2.4
        with:
          swift-version: "6.2"

      - name: Set up go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # ratchet:actions/setup-go@v6.4
        with:
          go-version: "1.26"
          cache: false

      - name: Set up protoc
        uses: ./.github/actions/install-protoc

      - name: Re-generate
        run: |
          set -e
          V=$(sed -n 's/^version: *//p' librarian.yaml)
          go run github.com/googleapis/librarian/cmd/librarian@${V} generate --all

      - name: Detect drift
        run: git diff --exit-code
