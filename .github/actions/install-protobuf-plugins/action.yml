name: Install Protoc Plugins (Swift & gRPC-Swift)
description: Install protoc-gen-swift and protoc-gen-grpc-swift with caching
inputs:
  swift-protobuf-version:
    description: "Version of apple/swift-protobuf to install"
    required: false
    default: "1.38.1"
  grpc-swift-version:
    description: "Version of grpc/grpc-swift to install"
    required: false
    default: "1.23.0"
runs:
  using: composite
  steps:
    - name: Create local bin directory
      shell: bash
      run: mkdir -p "${HOME}/.local/bin"
    - name: Cache plugins
      id: cache-plugins
      uses: actions/cache@v4
      with:
        path: |
          ~/.local/bin/protoc-gen-swift
          ~/.local/bin/protoc-gen-grpc-swift
        key: ${{ runner.os }}-protoc-plugins-${{ inputs.swift-protobuf-version }}-${{ inputs.grpc-swift-version }}
    - name: Build and install plugins
      if: steps.cache-plugins.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -e
        BUILD_DIR=$(mktemp -d)

        echo "Building apple/swift-protobuf v${{ inputs.swift-protobuf-version }}..."
        git clone --depth 1 --branch "${{ inputs.swift-protobuf-version }}" https://github.com/apple/swift-protobuf.git "${BUILD_DIR}/swift-protobuf"
        cd "${BUILD_DIR}/swift-protobuf"
        swift build -c release
        cp .build/release/protoc-gen-swift "${HOME}/.local/bin/"

        echo "Building grpc/grpc-swift v${{ inputs.grpc-swift-version }}..."
        git clone --depth 1 --branch "${{ inputs.grpc-swift-version }}" https://github.com/grpc/grpc-swift.git "${BUILD_DIR}/grpc-swift"
        cd "${BUILD_DIR}/grpc-swift"
        swift build -c release --product protoc-gen-grpc-swift
        cp .build/release/protoc-gen-grpc-swift "${HOME}/.local/bin/"

        rm -rf "${BUILD_DIR}"
    - name: Add to PATH
      shell: bash
      run: |
        echo "${HOME}/.local/bin" >> $GITHUB_PATH
    - name: Verify installation
      shell: bash
      run: |
        export PATH="${HOME}/.local/bin:${PATH}"
        echo "Installed protoc-gen-swift version:"
        protoc-gen-swift --version
        echo "Installed protoc-gen-grpc-swift version:"
        protoc-gen-grpc-swift --version
